<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An apex point sits at the top. Twelve lines fan out from the apex down to a dashed ellipse representing a circle viewed at an angle. One of those lines is highlighted as the current position of b_x. The full set of lines forms a cone, while only the highlighted line's endpoint traces the circle as it rotates.</desc>
